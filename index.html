 "Menu", "date": "2026-11-10", "title": "Breakfast: Basic Preparation Instructions for Creamy Wheat Farina Hot Cereal", "notes": "The one box of cream of wheat. Another box is already on the buy list and is not for this breakfast.", "recipeSlug": "basic-preparation-instructions-for-creamy-wheat-farina-hot-cereal", "meal": "breakfast", "slotType": "fixed", "prepStrategy": "fresh"}, {"id": "meal:2026-11-10:dinner:honey-dijon-chicken", "type": "Menu", "date": "2026-11-10", "title": "Dinner: Honey Dijon Chicken", "notes": "Two chicken breasts, not four. Finish one partial Dijon jar. Honey from the cupboard above the microwave. A pinch of savory in the glaze. Plates are filled out with penne and the 14.5 oz Alfredo jar, plus the leftover dashi soup and salmon skin. Frozen broccoli on the side. Parmesan is only a tiny bit, so sprinkle what is left on the pasta.", "recipeSlug": "honey-dijon-chicken", "meal": "dinner", "slotType": "use-up", "prepStrategy": "fresh"}, {"id": "meal:2026-11-11:breakfast:black-bean-brownies", "type": "Menu", "date": "2026-11-11", "title": "Breakfast: Black Bean Brownies", "notes": "About 1.5 cups cooked black beans from the dry beans, a spoon of cocoa, and honey from the microwave cupboard. Half a cup of the accessible oatmeal, blended, because quick oats are out of the bins. Chocolate chips only if a bag is already in the house.", "recipeSlug": "black-bean-brownies", "meal": "breakfast", "slotType": "fixed", "prepStrategy": "fresh"}, {"id": "meal:2026-11-11:dinner:turkey-chili", "type": "Menu", "date": "2026-11-11", "title": "Dinner: Turkey Chili", "notes": "1 lb ground turkey plus about 1/2 cup dry TVP, rehydrated, so the chili still feeds six. One portion of the kidney beans, the diced tomatoes, and some tomato paste. Skip cannellini and pinto unless those cans are actually on the shelf. Chili powder and cumin are on hand. This is the TVP trial, not a plan to finish the whole bag.", "recipeSlug": "turkey-chili", "meal": "dinner", "slotType": "favorite", "prepStrategy": "fresh"}, {"id": "meal:2026-11-11:snack:fresh-milled-bread-machine-loaf", "type": "Menu", "date": "2026-11-11", "title": "Snack: Fresh-Milled Bread Machine Loaf", "notes": "Enhancer bucket only. Do not mill flour and do not start the machine. Mix and label a jar for 7 loaves: 3 1/2 cups powdered milk, 1 3/4 cups potato flakes, 1 3/4 cups sugar, 3 1/2 Tbsp salt, 7/8 cup vital wheat gluten, and butter powder equal to 1 3/4 cups butter. Measure the finished volume, divide by 7, and write that scoop on the jar. If powdered milk, potato flakes, or butter powder is short, mix only as many loaves as the smallest jar allows.", "recipeSlug": "fresh-milled-bread-machine-loaf", "meal": "snack", "slotType": "use-up", "prepStrategy": "prep-ahead"}, {"id": "meal:2026-11-12:breakfast:easy-overnight-oats", "type": "Menu", "date": "2026-11-12", "title": "Breakfast: Easy Overnight Oats", "notes": "Mix Wednesday night. Liquid is the buttermilk kefir, with plain kefir or the last of the milk if the jars need more. Make only as many jars as the accessible oatmeal allows. Chia and a little honey.", "recipeSlug": "easy-overnight-oats", "meal": "breakfast", "slotType": "fixed", "prepStrategy": "prep-ahead"}, {"id": "meal:2026-11-12:dinner:tikka-masala-pouches", "type": "Menu", "date": "2026-11-12", "title": "Dinner: Tikka Masala Pouches with Turkey", "notes": "1 lb of the remaining ground turkey, one tikka pouch, and couscous. That leaves two tikka pouches and the coconut curry pouch. Toppings for texture: shredded cabbage, the half bag of spinach, diced onion, shredded carrot, Monday's roasted pumpkin seeds, and a spoon of plain kefir. Add bottled chickpeas if that jar is still there. Frozen green beans only if the plate still looks bare.", "recipeSlug": "tikka-masala-pouches", "meal": "dinner", "slotType": "use-up", "prepStrategy": "fresh"}, {"id": "meal:2026-11-13:breakfast:3-ingredient-vegan-banana-oat-pancakes", "type": "Menu", "date": "2026-11-13", "title": "Breakfast: 3-Ingredient Vegan Banana Oat Pancakes", "notes": "Use the two hands of bananas. The recipe batch is small, so repeat until the bananas are gone or the accessible oats run out. Eggs on the side if the oats run out first.", "recipeSlug": "3-ingredient-vegan-banana-oat-pancakes", "meal": "breakfast", "slotType": "fixed", "prepStrategy": "fresh"}, {"id": "meal:2026-11-13:dinner:egg-salad-wraps-vagabonding", "type": "Menu", "date": "2026-11-13", "title": "Dinner: Egg Salad Wraps - Vagabonding", "notes": "12 eggs on the one loaf baked Friday from the enhancer bucket. A few flour tortillas are not enough for wraps. Mustard instead of the skosh of relish. Mayo is probably gone after Monday's keto salad, so make a small batch Thursday if the jar is empty. A quarter cup is enough.", "recipeSlug": "egg-salad-wraps-vagabonding", "meal": "dinner", "slotType": "favorite", "prepStrategy": "fresh"}, {"id": "meal:2026-11-13:snack:practice-gingerbread-slab", "type": "Menu", "date": "2026-11-13", "title": "Snack: Practice Gingerbread Slab", "notes": "First laser-practice slab, baked Friday afternoon so it can cool and dry overnight. One batch only. Cheap dough: whole wheat flour, a quarter cup of oil instead of butter, a quarter cup of the blackstrap already open, a little brown sugar, one egg, ginger, and pumpkin pie spice. No icing. Engrave Saturday once it is cool. Do not serve it if the laser also cuts wood or plastic.", "recipeSlug": "practice-gingerbread-slab", "meal": "snack", "slotType": "use-up", "prepStrategy": "fresh"}, {"id": "meal:2026-11-14:breakfast:pumpkin-chocolate-chip-cookies", "type": "Menu", "date": "2026-11-14", "title": "Breakfast: Pumpkin Chocolate Chip Cookies", "notes": "Morning is the unmixed pumpkin pastries: mix the filling and bake them. Cookies can follow once the oven is free, or during the afternoon. Cookies need about 1 cup puree and ground cinnamon. If cinnamon is not home yet, use pumpkin pie spice. Chocolate chips only if they are already in the house. The pumpkin fruit leather can go into the cookies if it is still there. Engrave Friday's cooled gingerbread slab whenever the oven is busy. Mix a second slab only if the first one was too soft, too dark, or broke, and change just one thing.", "recipeSlug": "pumpkin-chocolate-chip-cookies", "meal": "breakfast", "slotType": "use-up", "prepStrategy": "fresh"}, {"id": "meal:2026-11-14:dinner:cabbage-beef-skillet", "type": "Menu", "date": "2026-11-14", "title": "Dinner: Cabbage Beef Skillet", "notes": "Stovetop, so the oven can stay on pastries and cookies. The last half pound of beef, shredded cabbage, carrots, garlic, and soy. Not pumpkin soup.", "recipeSlug": "cabbage-beef-skillet", "meal": "dinner", "slotType": "use-up", "prepStrategy": "fresh"}, {"id": "meal:2026-11-15:breakfast:german-pancakes", "type": "Menu", "date": "2026-11-15", "title": "Breakfast: German Pancakes", "notes": "Third Sunday of November, so German pancakes. Flour and the syrup above the microwave are on hand. Eggs are on hand. Milk is only half a gallon, so this assumes the milk buy has happened.", "recipeSlug": "german-pancakes", "meal": "breakfast", "slotType": "fixed", "prepStrategy": "fresh"}, {"id": "meal:2026-11-15:dinner:bread-machine-pizza-dough", "type": "Menu", "date": "2026-11-15", "title": "Dinner: Bread Machine Pizza Dough", "notes": "Homemade pizza. Yeast and whole wheat flour are on hand. Sauce from a can of tomato sauce. Pepperoni is 1 lb 5 oz, so do not buy more. Buy mozzarella unless a bag turns up before Sunday. Other toppings already here: mushrooms, artichoke hearts, green olives, onion.", "recipeSlug": "bread-machine-pizza-dough", "meal": "dinner", "slotType": "fixed", "prepStrategy": "fresh"}], "recipes": [{"slug": "moms-taco-salad", "title": "Mom's Taco Salad", "html": "\u003ch2>Mom&#x27;s Taco Salad\u003c/h2>\n\u003cp>Mom&#x27;s layered taco salad — mostly romaine, sweet-savory with pineapple tidbits. \u003cstrong>Cooler-friendly:\u003c/strong> pack components separately for fair (Fri–Sat); assemble on plates or in bowls at serving time. Serve with \u003cstrong>homemade ranch\u003c/strong>, salsa, tortilla chips, and/or warm corn tortillas.\u003c/p>\n\u003cp>\u003cstrong>Protein swap:\u003c/strong> Mom uses 1 lb hamburger; use \u003cstrong>ground turkey\u003c/strong> when cheaper (1 lb frozen on hand at farm).\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>3–4\u003c/td>\u003ctd>heads\u003c/td>\u003ctd>romaine lettuce\u003c/td>\u003ctd>Mostly romaine base — chop bite-sized; Broulim&#x27;s deal romaine\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>lb\u003c/td>\u003ctd>ground beef or ground turkey\u003c/td>\u003ctd>Brown with taco seasoning; cool before packing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>cheese\u003c/td>\u003ctd>Shredded or cubed — mozzarella on hand + deal block\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (20 oz)\u003c/td>\u003ctd>pineapple tidbits\u003c/td>\u003ctd>Drain; ~8 oz for salad — buy **20 oz** FC ($0.08/fl oz beats 8 oz @ $0.16/fl oz)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>cans (15 oz)\u003c/td>\u003ctd>kidney beans\u003c/td>\u003ctd>Or **1 qt cooked dried red beans** on hand (preferred this week)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (15 oz)\u003c/td>\u003ctd>corn\u003c/td>\u003ctd>Or **2 cups** frozen corn — pantry frozen corn out; shop\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>homemade ranch\u003c/td>\u003ctd>[Homemade ranch](homemade-ranch.md) — replaces Hidden Valley packet (no dextrose)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>salsa\u003c/td>\u003ctd>On hand or shop\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>bag\u003c/td>\u003ctd>tortilla chips\u003c/td>\u003ctd>**1 bag per serve night** — pack separately for crunch; fair Fri+Sat = 2 bags\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>corn tortillas\u003c/td>\u003ctd>Warm at serve; whole wheat + white flour on hand\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Lettuce:\u003c/strong> Chop romaine; wash and dry well. For fair packs, store in a container with paper towel.\u003c/li>\n\u003cli>\u003cstrong>Meat:\u003c/strong> Brown 1 lb ground turkey (or beef) with taco seasoning; drain. Cool completely.\u003c/li>\n\u003cli>\u003cstrong>Beans:\u003c/strong> Rinse canned kidney beans, or use \u003cstrong>pre-cooked dried red beans\u003c/strong> (~1 qt) from pantry.\u003c/li>\n\u003cli>\u003cstrong>Corn:\u003c/strong> Drain canned corn or thaw/use frozen (2 cups).\u003c/li>\n\u003cli>\u003cstrong>Assembly (serve night):\u003c/strong> Large bowl or individual plates — romaine base, then beans, corn, pineapple, warm meat, cheese. Top with crushed chips or serve chips on the side. Pass ranch and salsa. Warm corn tortillas optional.\u003c/li>\n\u003cli>\u003cstrong>Fair cooler pack (Thu PM prep):\u003c/strong> Separate containers — greens | meat | beans+corn+pineapple mix | cheese | ranch | salsa | chips | tortillas bag.\u003c/li>\n\u003c/ol>\n\u003ch3>Prep ahead\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Thu 7/30 PM\u003c/strong> (after tortilla soup): Cook meat, drain pineapple, combine beans/corn/pineapple, portion cheese, \u003cstrong>make [homemade ranch](homemade-ranch.md) (~2 cups)\u003c/strong>, chop romaine. Two nights of fair dinners from one batch.\u003c/li>\n\u003cli>\u003cstrong>Kidney beans from dried:\u003c/strong> Soak/cook \u003cstrong>dried red beans\u003c/strong> Wed or Thu AM (~1 qt cooked) — on hand at farm; do not buy canned kidney.\u003c/li>\n\u003c/ul>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>\n\u003ch4>2026-07-30\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Cooked for:\u003c/strong> fair prep snack slot, week 2026-W31\u003c/li>\n\u003cli>\u003cstrong>Partial prep:\u003c/strong> Dried red beans quick-soaked Thu AM, cooked ~3 qt; homemade ranch done. \u003cstrong>Not yet portioned\u003c/strong> — still need meat, romaine, pineapple, corn, cheese for Fri AM fair packs.\u003c/li>\n\u003cli>\u003cstrong>Streamline tips:\u003c/strong> Beans + ranch ahead helps; finish chop/portion Fri before fair.\u003c/li>\n\u003c/ul>", "missing": false, "path": "food/recipes/moms-taco-salad.md"}, {"slug": "basic-preparation-instructions-for-creamy-wheat-farina-hot-cereal", "title": "Basic Preparation Instructions for Creamy Wheat Farina Hot Cereal", "html": "\u003ch2>Basic Preparation Instructions for Creamy Wheat Farina Hot Cereal\u003c/h2>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>4 cups Water\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>½ tsp Salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 cup Organic Wheat Farina or White Wheat Farina\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Bring water and salt to a boil. Slowly whisk in cereal, reduce heat to medium-low and cook, whisking frequently, for 3 minutes. Remove from heat and let stand 2 minutes.\u003c/li>\n\u003cli>Combine water, salt and cereal in a slow cooker. Stir well. Cover and cook on low for 3–4 hours or high for 1 ½–2 hours. Stir well and serve.\u003c/li>\n\u003cli>Combine ¼ cup cereal, 1 cup water and a pinch of salt in a microwave safe bowl. Stir well. Microwave on high for 30 second intervals, stirring frequently. Let stand for 2 minutes. Makes 1 serving.\u003c/li>\n\u003c/ol>\n\u003ch3>Notes\u003c/h3>\n\u003cp>Our Bob’s Red Mill Creamy Wheat Hot Cereal (also known as wheat farina) is one of our very favorite hot cereals. It’s made from hard wheat and can be served as a delicious breakfast cereal with brown sugar and cream, or made savory and high in protein with the addition of an egg.\u003c/p>\n\u003cp>Our Basic Preparation Instructions for Creamy Wheat Farina Hot Cereal suggest serving it hot, with brown sugar and milk, and a pat of butter. For something slightly different, serve it with cinnamon, maple syrup, bananas or other fruit.\u003c/p>\n\u003cp>Depending on your preparation of choice, you can make cream of wheat on the stovetop, slow cooker or in the microwave.\u003c/p>\n\u003cp>For stovetop preparation, bring water and salt to a boil then slowly whisk in the cereal. Reduce the heat to medium-low and cook, whisking frequently. Once it’s removed from the heat, allow your cereal to stand for two minutes then decorate as you please!\u003c/p>\n\u003cp>The slow cooker prep method is good for enjoying cream of wheat on busy school or workdays. Simply combine your water, salt and cereal in a slow cooker, stir and cover. Cook on high for 1 ½–2 hours when you first wake up in the morning, then enjoy a tasty meal before the kids leave.\u003c/p>\n\u003cp>For microwave prep, combine your cereal and salt in a microwave-safe bowl, stir well, and microwave on high in 30-second intervals. When you have a craving for cream of wheat but not much time to prepare it, this method works well!\u003c/p>\n\u003cp>However you choose to enjoy our wholesome Creamy Wheat Farina Hot Cereal, we hope you love it. It’s smooth, satisfying and sure to fill you up and keep you going throughout the whole morning.\u003c/p>\n\u003cp>Once you master this hot cereal recipe, try using our Wheat Farina for other breakfast favorites, like Banana Nut Pancakes or Arugula Eggs Benedict with Crispy Farina Cakes. Farina also tastes delightful in desserts, like this simple recipe for Butterscotch Pecan Squares.\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>\n\u003ch4>2026-07-30\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Cooked for:\u003c/strong> breakfast, week 2026-W31\u003c/li>\n\u003cli>\u003cstrong>Liked:\u003c/strong> (not specified — default breakfast)\u003c/li>\n\u003cli>\u003cstrong>Deviation:\u003c/strong> Planned egg muffins not baked — creamed wheat instead (fair-week shortcut).\u003c/li>\n\u003c/ul>", "missing": false, "path": "food/recipes/basic-preparation-instructions-for-creamy-wheat-farina-hot-cereal.md"}, {"slug": "honey-dijon-chicken", "title": "Honey Dijon Chicken", "html": "\u003ch2>Honey Dijon Chicken\u003c/h2>\n\u003cp>Quick sheet-pan or skillet chicken coated in honey-Dijon. Written from the W45 use-up plan — finish one open Dijon jar; keep the second.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>4 chicken breasts\u003c/td>\u003ctd>Or equivalent thighs\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Partial Dijon mustard jar\u003c/td>\u003ctd>Use enough to finish one jar\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>A few tbsp honey\u003c/td>\u003ctd>From a partial jar\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Garlic\u003c/td>\u003ctd>Minced or powder\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Oil\u003c/td>\u003ctd>Enough to loosen the marinade\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Salt and pepper\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Suggested sides (W45):\u003c/strong> cheesy polenta, zucchini, broccoli. Optional: penne with a jar of Alfredo on the table for kids who skip the chicken.\u003c/p>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Heat oven to \u003cstrong>400°F\u003c/strong> (or use a large skillet on medium).\u003c/li>\n\u003cli>Stir Dijon, honey, garlic, oil, salt, and pepper into a thick glaze.\u003c/li>\n\u003cli>Coat chicken. Bake \u003cstrong>25–30 min\u003c/strong> until done (165°F), or pan-cook until cooked through, flipping once.\u003c/li>\n\u003cli>Rest a few minutes. Serve with sides. Put Alfredo pasta on the table as a backup plate.\u003c/li>\n\u003c/ol>", "missing": false, "path": "food/recipes/honey-dijon-chicken.md"}, {"slug": "black-bean-brownies", "title": "Black Bean Brownies", "html": "\u003ch2>Black Bean Brownies\u003c/h2>\n\u003cp>From Chocolate Covered Katie.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1 1/2 cups black beans ((1 15-oz can, drained and rinsed very well) (250g after draining))\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 tbsp cocoa powder ((10g))\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 cup quick oats ((40g) (See nutrition link below for substitutions)) • 1/4 tsp salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/3 cup pure maple syrup, (honey, or agave (75g))\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pinch uncut stevia OR 2 tbsp sugar ((or omit and increase maple syrup to 1/2 cup))\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4 cup coconut or vegetable oil ((40g) (See nutrition link for substitution notes))\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 tsp pure vanilla extract\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 tsp baking powder\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 cup to 2/3 cup chocolate chips ((Not optional. Omit at your own risk)) • optional: more chips, (for presentation)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Black Bean Brownies Recipe: Preheat oven to 350 F. Combine all ingredients except chips in a good food processor, and blend until completely smooth. Really blend well. (A blender can work if you absolutely must, but the texture—and even the taste—will be much better in a food processor. I use this food processor.) Stir in the chips, then pour into a greased 8x8 pan. Optional: sprinkle extra chocolate chips over the top. Cook the black bean brownies 15-18 minutes, then let cool at least 10 minutes before trying to cut. If they still look a bit undercooked, you can place them in the fridge overnight and they will magically firm up! Makes 9-12 brownies. If you make this recipe, don&#x27;t forget to leave a review! The trick with these: serve them first, and then reveal the secret ingredient. In all the times I’ve served bean desserts, not one single person who didn’t know beforehand has ever guessed!View Black Bean Brownies Nutrition Facts\u003c/li>\n\u003c/ol>\n\u003ch3>Notes\u003c/h3>\n\u003cp>These super healthy black bean brownies are the ultra fudgy and decadent chocolate treat.\u003c/p>\n\u003cp>NUTRITION\u003c/p>\n\u003cp>Serving Size: 1 serving\u003c/p>\n\u003cp>Calories: 115 kcal\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/black-bean-brownies.md"}, {"slug": "cook-dried-beans", "title": "Cook Dried Beans", "html": "\u003ch2>Cook Dried Beans\u003c/h2>\n\u003cp>Soak and cook dried beans ahead of soup, chili, or brownies. Skip this card when beans are already bottled or cooked.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Dried beans\u003c/td>\u003ctd>Black, pinto, white, or kidney — amount for the meal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Water\u003c/td>\u003ctd>Cover by 2–3 inches to soak; fresh water to cook\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Salt\u003c/td>\u003ctd>Add after beans are tender\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Soak\u003c/strong> overnight (or 8+ hours) in plenty of water. Drain and rinse.\u003c/li>\n\u003cli>\u003cstrong>Cook:\u003c/strong> cover with fresh water. Instant Pot high pressure ~25–35 min (bean type varies), or simmer on the stove until tender.\u003c/li>\n\u003cli>Salt to taste once soft. Cool. Refrigerate up to 5 days or freeze in quart portions.\u003c/li>\n\u003c/ol>\n\u003ch3>Notes\u003c/h3>\n\u003cul>\n\u003cli>Same-day pressure cook from unsoaked is OK when the recipe allows it — still plan time.\u003c/li>\n\u003cli>For black bean soup: one quart cooked beans ≈ one dinner pot.\u003c/li>\n\u003c/ul>", "missing": false, "path": "food/recipes/cook-dried-beans.md"}, {"slug": "turkey-chili", "title": "Turkey Chili", "html": "\u003ch2>Turkey Chili\u003c/h2>\n\u003cp>Three-bean turkey chili. Brown turkey before freezing; tomatoes after meat for Instant Pot.\u003c/p>\n\u003ch3>Ingredients to freeze\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>lb\u003c/td>\u003ctd>ground turkey\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>large\u003c/td>\u003ctd>onion\u003c/td>\u003ctd>diced\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>large\u003c/td>\u003ctd>garlic cloves\u003c/td>\u003ctd>minced\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>bell pepper\u003c/td>\u003ctd>diced\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 1/2\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>corn\u003c/td>\u003ctd>canned or frozen\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (14 oz)\u003c/td>\u003ctd>red kidney beans\u003c/td>\u003ctd>low sodium, rinsed &amp; drained\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (14 oz)\u003c/td>\u003ctd>cannellini or navy beans\u003c/td>\u003ctd>low sodium, rinsed &amp; drained\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (14 oz)\u003c/td>\u003ctd>pinto beans or black-eyed peas\u003c/td>\u003ctd>low sodium, rinsed &amp; drained\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>tbsp\u003c/td>\u003ctd>chili powder\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>cumin\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>oregano\u003c/td>\u003ctd>dried\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>paprika\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3/4\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (28 oz)\u003c/td>\u003ctd>diced tomatoes\u003c/td>\u003ctd>low sodium — after meat for Instant Pot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>can (6 oz)\u003c/td>\u003ctd>tomato paste\u003c/td>\u003ctd>low sodium\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Ingredients to serve (not frozen)\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>green onion, cilantro, cheese, plain yogurt\u003c/td>\u003ctd>toppings\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003cp>\u003cstrong>Before freezing:\u003c/strong> Cook ground turkey 5 min, breaking into pieces. Transfer to bag with other ingredients (Instant Pot: tomato products right after meat).\u003c/p>\n\u003cp>\u003cstrong>Before cooking:\u003c/strong> Add \u003cstrong>1 cup water\u003c/strong> or low-sodium broth.\u003c/p>\n\u003cp>\u003cstrong>Instant Pot:\u003c/strong> Cook from frozen on High pressure 20 minutes, Quick Release.\u003c/p>\n\u003cp>\u003cstrong>Slow cooker:\u003c/strong> Cook from frozen High 4 hours or Low 8 hours.\u003c/p>\n\u003ch3>Container label\u003c/h3>\n\u003cp>\u003cstrong>Instant Pot\u003c/strong> – 20 mins, QR \u003cstrong>OR Slow Cooker\u003c/strong> – Low 8 hrs, High 4 hrs. \u003cstrong>Before:\u003c/strong> 1 cup water/broth.\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/turkey-chili.md"}, {"slug": "fresh-milled-bread-machine-loaf", "title": "Fresh-Milled Bread Machine Loaf", "html": "\u003ch2>Fresh-Milled Bread Machine Loaf\u003c/h2>\n\u003cp>2-pound sandwich loaf from the shared ChatGPT thread &quot;Freshly Milled Bread Recipe.&quot; The settled loaf uses sugar instead of honey, butter powder instead of oil, and no egg.\u003c/p>\n\u003cp>Mill the wheat the same day. Hard white wheat is the one named in that chat. Start with 5 cups of flour and 1½ cups of water, then fix the dough in the first few minutes of kneading.\u003c/p>\n\u003ch3>Add to the pan in this order\u003c/h3>\n\u003cp>Liquids first, which fits a Breadman-style machine.\u003c/p>\n\u003ch4>Liquids\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1½\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>warm water\u003c/td>\u003ctd>Starting point after dropping the honey. Add or hold back a spoon during kneading\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Dry ingredients\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>freshly milled hard white wheat\u003c/td>\u003ctd>Up to 5½ cups if the dough looks like batter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>½\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>powdered milk\u003c/td>\u003ctd>Mixed into the flour\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¼\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>sugar\u003c/td>\u003ctd>Replaces ⅓ cup honey\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¼\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>instant potato flakes\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1½\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Tbsp\u003c/td>\u003ctd>vital wheat gluten\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>butter powder\u003c/td>\u003ctd>Enough to equal ¼ cup butter. Follow the can. Put the powder in with the dry ingredients. The 1½ cups of water already allows for it\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Yeast\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>bread machine yeast or instant yeast\u003c/td>\u003ctd>Last, in a well on top if the machine wants that\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>No egg.\u003c/p>\n\u003ch3>Settings\u003c/h3>\n\u003cul>\n\u003cli>Whole wheat cycle\u003c/li>\n\u003cli>2 lb loaf\u003c/li>\n\u003cli>Light or medium crust\u003c/li>\n\u003c/ul>\n\u003ch3>Dough check\u003c/h3>\n\u003cp>In the first 5–10 minutes of kneading, the ball should be soft and slightly tacky. It should stick to the side for a moment and then pull away.\u003c/p>\n\u003cul>\n\u003cli>Dry baseball: add water 1 tablespoon at a time.\u003c/li>\n\u003cli>Smears like batter: add flour 1 tablespoon at a time.\u003c/li>\n\u003c/ul>\n\u003cp>Write the water amount that worked on the mix bucket.\u003c/p>\n\u003ch3>Enhancer mix for 7 loaves\u003c/h3>\n\u003cp>Flour stays out of this bucket so it can be milled fresh each loaf.\u003c/p>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Ingredient\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>3½ cups\u003c/td>\u003ctd>powdered milk\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1¾ cups\u003c/td>\u003ctd>potato flakes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1¾ cups\u003c/td>\u003ctd>sugar\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10½ tsp (3½ Tbsp)\u003c/td>\u003ctd>salt\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>⅞ cup (14 Tbsp)\u003c/td>\u003ctd>vital wheat gluten\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>powdered butter equal to 1¾ cups butter\u003c/td>\u003ctd>follow the can\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The thread guessed about 1½ cups of this mix per loaf once the butter powder is in it. Measure one finished batch and write the real scoop on the container.\u003c/p>\n\u003cp>Baking day, once that scoop is known:\u003c/p>\n\u003col>\n\u003cli>Mill 5 cups of wheat.\u003c/li>\n\u003cli>Add one scoop of enhancer mix.\u003c/li>\n\u003cli>Add 1½ cups of water.\u003c/li>\n\u003cli>Add 2 tsp of yeast.\u003c/li>\n\u003cli>Run the machine.\u003c/li>\n\u003c/ol>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/fresh-milled-bread-machine-loaf.md"}, {"slug": "easy-overnight-oats", "title": "Easy Overnight Oats", "html": "\u003ch2>Easy Overnight Oats\u003c/h2>\n\u003cp>No-cook grab-and-go breakfast. Prep jars Sunday night for the week; customize toppings daily.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ch4>Base (per serving)\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1/2\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>rolled oats\u003c/td>\u003ctd>old-fashioned, not quick or steel-cut\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>milk\u003c/td>\u003ctd>any kind\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Family add-ins (per serving — recommended)\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1/4\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>Greek yogurt\u003c/td>\u003ctd>non-fat or regular\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Tbsp\u003c/td>\u003ctd>chia seeds\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Tbsp\u003c/td>\u003ctd>honey or maple syrup\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>vanilla extract\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Toppings (optional, night before or morning of)\u003c/h4>\n\u003cp>Fresh or dried fruit, nut butter, nuts, cinnamon, chocolate chips, etc.\u003c/p>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>For each serving, combine oats, milk, yogurt, chia, sweetener, and vanilla in a jar or container.\u003c/li>\n\u003cli>Stir well. Cover and refrigerate at least 2 hours or overnight.\u003c/li>\n\u003cli>Add toppings before serving. Thin with extra milk or water if desired.\u003c/li>\n\u003c/ol>\n\u003ch3>Batch prep (6 servings)\u003c/h3>\n\u003cp>Multiply per-serving amounts into one large container, or prep 6 individual jars. Keeps in fridge up to 5 days.\u003c/p>\n\u003cp>\u003cstrong>Ratio to remember:\u003c/strong> 1 part oats + 1 part milk (+ 1/8 part chia if using).\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/easy-overnight-oats.md"}, {"slug": "tikka-masala-pouches", "title": "Tikka Masala Pouches with Turkey", "html": "\u003ch2>Tikka Masala Pouches with Turkey\u003c/h2>\n\u003cp>Pantry shortcut: simmer ground turkey in a ready tikka masala pouch and serve over couscous. Written from the W45 use-up plan.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1 lb ground turkey\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 pouch (~7 oz) tikka masala sauce\u003c/td>\u003ctd>Leave other pouches for later\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 box couscous\u003c/td>\u003ctd>Cook per package\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Frozen green beans\u003c/td>\u003ctd>Side, if wanted\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Oil or butter\u003c/td>\u003ctd>For browning turkey\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Texture toppings\u003c/h4>\n\u003cp>Sauce and couscous alone are too soft. Put a few of these on the table and let people add their own.\u003c/p>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Topping\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Shredded cabbage\u003c/td>\u003ctd>Crunch\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Handful of spinach\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Diced onion\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Shredded carrot\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Roasted pumpkin seeds\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Canned or bottled chickpeas\u003c/td>\u003ctd>Rinsed, if a jar is open\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Spoon of plain kefir\u003c/td>\u003ctd>Cool contrast\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Frozen peas, warmed\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Brown turkey in a skillet with a little oil; drain if needed.\u003c/li>\n\u003cli>Stir in the tikka pouch. Simmer a few minutes until hot and saucy. Add a splash of water if too thick.\u003c/li>\n\u003cli>Cook couscous per package.\u003c/li>\n\u003cli>Steam or microwave green beans if using them.\u003c/li>\n\u003cli>Serve turkey tikka over couscous with the toppings on the table.\u003c/li>\n\u003c/ol>", "missing": false, "path": "food/recipes/tikka-masala-pouches.md"}, {"slug": "3-ingredient-vegan-banana-oat-pancakes", "title": "3-Ingredient Vegan Banana Oat Pancakes", "html": "\u003ch2>3-Ingredient Vegan Banana Oat Pancakes\u003c/h2>\n\u003cp>From vancouverwithlove.com.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>2 cups rolled oats (if using oat flour instead, use 2¼ cups) • 2 bananas\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2¼ cups your favourite milk\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cooking oil, such as avocado oil or coconut oil (or use non-stick frying pan)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Berries or fruit\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Maple syrup\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Coconut whipped cream\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Add oats to blender and blend on high power for 20 seconds (until turned to flour).\u003c/li>\n\u003cli>Use end of a wooden spoon to loosen any flour that may be stuck in jug, then add bananas and milk.\u003c/li>\n\u003cli>Blend on high power for 30 seconds or until batter is combined, scraping down jug if needed.\u003c/li>\n\u003cli>Heat 1 tsp oil in frying pan on medium heat. Once pan is hot (when you can drip water on it and it sizzles), pour in ½ cup batter and allow to form a wide circle.\u003c/li>\n\u003cli>Cook for 2-3 minutes or until batter forms bubble holes and looks solid.\u003c/li>\n\u003cli>Flip pancake with spatula, then cook another 2 minutes.\u003c/li>\n\u003cli>Repeat for all pancakes (you&#x27;ll get 6-7), adding more oil as needed.\u003c/li>\n\u003cli>Store on warm plate in oven until ready to eat, and serve with fresh berries, fruit, maple syrup, coconut cream or chocolate ganache.\u003c/li>\n\u003c/ol>\n\u003ch3>Notes\u003c/h3>\n\u003cp>Oats, banana and dairy-free milk make these the easiest vegan banana oat pancakes ever! Naturally gluten free and with an oil-free option.\u003c/p>\n\u003cp>NUTRITION\u003c/p>\n\u003cp>Serving Size: 1 serving\u003c/p>\n\u003cp>Calories: 263 kcal\u003c/p>\n\u003cp>Fat: 4.2 g\u003c/p>\n\u003cp>Saturated Fat: 0.5 g\u003c/p>\n\u003cp>Sodium: 50 mg\u003c/p>\n\u003cp>Carbohydrates: 51.8 g\u003c/p>\n\u003cp>Fiber: 6.4 g\u003c/p>\n\u003cp>Sugar: 16.9 g\u003c/p>\n\u003cp>Protein: 7.4 g\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/3-ingredient-vegan-banana-oat-pancakes.md"}, {"slug": "egg-salad-wraps-vagabonding", "title": "Egg Salad Wraps - Vagabonding", "html": "\u003ch2>Egg Salad Wraps - Vagabonding\u003c/h2>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>12 eggs\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4 c mayonnaise\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 T mustard\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12 tortillas\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Relish\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Boil the eggs\u003c/li>\n\u003cli>Mash the eggs. And mix in mayo and mustard\u003c/li>\n\u003cli>Put the salad in tortillas with relish\u003c/li>\n\u003c/ol>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/egg-salad-wraps-vagabonding.md"}, {"slug": "homemade-mayo-dwtc", "title": "Homemade Mayo (Don't Waste the Crumbs)", "html": "\u003ch2>Homemade Mayo (Don&#x27;t Waste the Crumbs)\u003c/h2>\n\u003cp>Immersion-blender mayo — one batch yields about \u003cstrong>1 cup\u003c/strong>. Scale batches as needed (chicken salad uses ~\u003cstrong>3 cups\u003c/strong> → \u003cstrong>3 batches\u003c/strong>).\u003c/p>\n\u003ch3>Ingredients (1 batch)\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1 whole egg\u003c/td>\u003ctd>room temperature\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 cup extra light olive oil\u003c/td>\u003ctd>or other neutral oil\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 tbsp lemon juice\u003c/td>\u003ctd>or juice of 1 large lemon\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 tsp kosher salt\u003c/td>\u003ctd>or ½ tsp table salt\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Optional: 1 tbsp whey (extends fridge life); extra seasonings to taste.\u003c/p>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>In a \u003cstrong>wide-mouth jar\u003c/strong>, layer in order: lemon juice, salt, egg, then oil. Do not stir.\u003c/li>\n\u003cli>Wait ~1 minute until the egg settles at the bottom and oil floats on top.\u003c/li>\n\u003cli>Place immersion blender at the \u003cstrong>bottom\u003c/strong> of the jar. Blend 20 seconds without moving.\u003c/li>\n\u003cli>Slowly raise the blender up the side of the jar while blending until all oil is incorporated.\u003c/li>\n\u003cli>Taste; adjust salt or lemon juice if needed.\u003c/li>\n\u003c/ol>\n\u003ch3>Scaling\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Batches\u003c/th>\u003cth>Mayo yield\u003c/th>\u003cth>Oil\u003c/th>\u003cth>Eggs\u003c/th>\u003cth>Lemon juice\u003c/th>\u003cth>Salt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>~1 cup\u003c/td>\u003ctd>1 cup\u003c/td>\u003ctd>1\u003c/td>\u003ctd>2 tbsp\u003c/td>\u003ctd>1 tsp\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>~3 cups\u003c/td>\u003ctd>3 cups\u003c/td>\u003ctd>3\u003c/td>\u003ctd>6 tbsp\u003c/td>\u003ctd>3 tsp\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Notes\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Do not buy jar mayo\u003c/strong> — make fresh for recipes that call for it (e.g. chicken salad).\u003c/li>\n\u003cli>Uses pantry oil and fridge eggs; no separate grocery line item unless oil is low.\u003c/li>\n\u003c/ul>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/homemade-mayo-dwtc.md"}, {"slug": "practice-gingerbread-slab", "title": "Practice Gingerbread Slab", "html": "\u003ch2>Practice Gingerbread Slab\u003c/h2>\n\u003cp>A cheap, sturdy slab for learning laser engraving. The first batches are for the machine, not for a tin of cookies. Repeat the same dough and change one thing at a time.\u003c/p>\n\u003cp>Nothing new to buy. No butter, no milk, no cinnamon, no icing, and no decorations. Butter is the expensive part of ordinary gingerbread, so this uses a little oil instead.\u003c/p>\n\u003cp>Whole wheat flour is already in the house. The slab will be darker than one made with white flour, so keep the bake from going deep brown or the engraved line will be hard to see.\u003c/p>\n\u003ch3>Ingredients (one slab)\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>whole wheat flour\u003c/td>\u003ctd>On hand. Add a spoon more if the dough is sticky\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>neutral oil\u003c/td>\u003ctd>Canola or whatever plain oil is open. Not butter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>blackstrap molasses\u003c/td>\u003ctd>On hand. This is enough for practice. More molasses makes a darker slab\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>brown sugar\u003c/td>\u003ctd>On hand\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>egg\u003c/td>\u003ctd>Binder so the slab does not crumble\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/3\u003c/td>\u003ctd>cup\u003c/td>\u003ctd>water\u003c/td>\u003ctd>Add a teaspoon at a time if the dough will not hold\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>baking soda\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>ground ginger\u003c/td>\u003ctd>On hand. Enough to smell like gingerbread\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>pumpkin pie spice\u003c/td>\u003ctd>Stands in for cinnamon, clove, and nutmeg. Do not buy cinnamon for this\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/4\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Heat the oven to \u003cstrong>350°F\u003c/strong>. Line a sheet with parchment.\u003c/li>\n\u003cli>Stir the oil, molasses, brown sugar, egg, and water together.\u003c/li>\n\u003cli>Stir in the baking soda, ginger, pumpkin pie spice, and salt, then the flour. The dough should be firm, not sticky and not crumbly. Fix it with a spoon of flour or a teaspoon of water.\u003c/li>\n\u003cli>Roll it on the parchment to an even \u003cstrong>1/4 inch\u003c/strong>. Do not dock the top. A smooth face engraves more cleanly. Trim the edges so the slab is a simple rectangle.\u003c/li>\n\u003cli>Bake until the surface is dry and the middle is set, about \u003cstrong>18–25 minutes\u003c/strong>. It should not feel bendy when cool. Pull it before it turns deep brown.\u003c/li>\n\u003cli>Cool completely on a rack, at least a few hours. Warm or soft dough scorches and cuts through.\u003c/li>\n\u003cli>Engrave only after it is cool and dry. Start with a simple large shape. Expect the first passes to scorch, cut through, or barely show. That is what this batch is for.\u003c/li>\n\u003c/ol>\n\u003ch3>What to change on batch two\u003c/h3>\n\u003cp>Bake a second slab only after the first one has been engraved. Keep the recipe the same and change a single thing:\u003c/p>\n\u003cul>\n\u003cli>Cut through or burned through → roll the next one a little thicker, or bake it only until dry.\u003c/li>\n\u003cli>Mark is too faint → bake the next one a shade lighter so the surface stays paler.\u003c/li>\n\u003cli>Crumbled under the laser → next dough gets a teaspoon more water, same bake.\u003c/li>\n\u003cli>Spread or got soft → next dough gets a spoon more flour and a longer cool.\u003c/li>\n\u003c/ul>\n\u003ch3>Do not eat a slab that went on the laser\u003c/h3>\n\u003cp>These pieces are practice. If that laser also cuts wood, acrylic, or plastic, do not serve the engraved slab. The dough is cheap on purpose so a ruined piece can go in the trash.\u003c/p>", "missing": false, "path": "food/recipes/practice-gingerbread-slab.md"}, {"slug": "pumpkin-chocolate-chip-cookies", "title": "Pumpkin Chocolate Chip Cookies", "html": "\u003ch2>Pumpkin Chocolate Chip Cookies\u003c/h2>\n\u003cp>From Cooking Classy.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1.5 c (250g) Whole wheat flour ((spoon and level to measure flour)) • 2 tsp baking powder\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3/4 tsp baking soda\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 1/2 tsp ground cinnamon\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 tsp ground ginger\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 tsp ground nutmeg\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/8 tsp ground cloves\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 tsp salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 cup (100g) granulated sugar\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 cup (110g) packed light-brown sugar\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2 cup (120ml) vegetable oil\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 large egg\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 tsp vanilla extract\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 cup (240g) canned pumpkin puree\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 1/2 cups (255g) semi-sweet chocolate chips\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Preheat oven to 350 degrees. Line baking sheets with silicone baking mats or parchment paper.\u003c/li>\n\u003cli>In a mixing bowl, whisk together flour, baking powder, baking soda, cinnamon, nutmeg, ginger, cloves and salt for 20 seconds, set aside.\u003c/li>\n\u003cli>In the bowl of an electric stand mixer fitted with the paddle attachment, blend together granulated sugar, brown sugar and vegetable oil until combined.\u003c/li>\n\u003cli>Mix in egg and vanilla then blend in pumpkin puree.\u003c/li>\n\u003cli>With mixer on low speed, slowly add in flour mixture and mix just until nearly combined, scraping down the sides of the bowl as needed (batter will be pretty wet).\u003c/li>\n\u003cli>With a rubber spatula, fold in chocolate chips while folding batter to evenly combined.\u003c/li>\n\u003cli>Drop dough 2 Tbsp (either using a medium cookie dough scoop or using two spoons) at a time onto baking sheets lined with Silcone liners or parchment paper, spacing cookies two inches apart.\u003c/li>\n\u003cli>Bake in preheated oven until cookies are nearly set about 11 - 13 minutes.\u003c/li>\n\u003cli>Allow to cool several minutes before transferring to a wire rack to cool.\u003c/li>\n\u003cli>Store in a single layer in an airtight container (these are best once they&#x27;ve rested in an airtight container a few hours, they soften throughout).\u003c/li>\n\u003c/ol>\n\u003ch3>Notes\u003c/h3>\n\u003cp>These cookies are so soft, perfectly pumpkiny and you&#x27;ll love all those sweet and tempting autumn spices. And let&#x27;s not forget about the abundance of decadent semi-sweet chocolate chips these cookies are swirled with, they just take them over the top! This is a staple fall recipe!\u003c/p>\n\u003cp>NUTRITION\u003c/p>\n\u003cp>Serving Size: 1 serving\u003c/p>\n\u003cp>Calories: 147 kcal\u003c/p>\n\u003cp>Fat: 7 g\u003c/p>\n\u003cp>Saturated Fat: 5 g\u003c/p>\n\u003cp>Cholesterol: 5 mg\u003c/p>\n\u003cp>Sodium: 74 mg\u003c/p>\n\u003cp>Carbohydrates: 18 g\u003c/p>\n\u003cp>Fiber: 1 g\u003c/p>\n\u003cp>Sugar: 10 g\u003c/p>\n\u003cp>Protein: 1 g\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/pumpkin-chocolate-chip-cookies.md"}, {"slug": "cabbage-beef-skillet", "title": "Cabbage Beef Skillet", "html": "\u003ch2>Cabbage Beef Skillet\u003c/h2>\n\u003cp>One-pan dinner that stays on the stove while the oven is busy. Built for the half pound of beef left after taco salad.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1/2\u003c/td>\u003ctd>lb\u003c/td>\u003ctd>ground beef\u003c/td>\u003ctd>The rest of the 1.5 lb after Monday&#x27;s taco salad\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1/2\u003c/td>\u003ctd>head\u003c/td>\u003ctd>cabbage\u003c/td>\u003ctd>Shredded. There are about 2 heads\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>carrots\u003c/td>\u003ctd>Shredded or sliced\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>cloves\u003c/td>\u003ctd>garlic\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Tbsp\u003c/td>\u003ctd>oil\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Tbsp\u003c/td>\u003ctd>soy sauce\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>salt and pepper\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Brown the beef in a wide pan. Drain if needed.\u003c/li>\n\u003cli>Add the oil if the pan is dry, then the cabbage, carrots, and garlic.\u003c/li>\n\u003cli>Cook until the cabbage is tender, about 10–15 minutes. Stir in the soy sauce.\u003c/li>\n\u003cli>Salt and pepper to taste.\u003c/li>\n\u003c/ol>", "missing": false, "path": "food/recipes/cabbage-beef-skillet.md"}, {"slug": "german-pancakes", "title": "German Pancakes", "html": "\u003ch2>German Pancakes\u003c/h2>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>16 eggs\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 cups milk\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 cups freshly milled whole wheat flour\u003c/td>\u003ctd>mill morning of or night before\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 t salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 cube butter\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Preheat the oven to 415.  Melt 1 T butter per skillet in oven as it preheats.  Blend all other ingredients.  Cook for 12 minutes.\u003c/li>\n\u003c/ol>\n\u003ch3>Mom&#x27;s recipe card (square pan)\u003c/h3>\n\u003cp>Small-batch version for a square cake pan — from Mom&#x27;s recipe cards.\u003c/p>\n\u003ch4>Ingredients\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>4 eggs\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>½ cup freshly milled whole wheat flour\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>½ cup milk\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¼ tsp salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>⅓ cube butter\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Instructions\u003c/h4>\n\u003col>\n\u003cli>Preheat oven to 425°.\u003c/li>\n\u003cli>Melt butter in pan.\u003c/li>\n\u003cli>Meanwhile blend ingredients and pour in pan.\u003c/li>\n\u003cli>Bake for 15–20 min or until brown and puffy.\u003c/li>\n\u003c/ol>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/german-pancakes.md"}, {"slug": "bread-machine-pizza-dough", "title": "Bread Machine Pizza Dough", "html": "\u003ch2>Bread Machine Pizza Dough\u003c/h2>\n\u003cp>No-knead pizza dough from the bread machine — enough for two 12-inch crusts or one sheet-pan pizza. Top with powdered-tomato sauce, mozzarella, pepperoni, artichoke hearts, and bell peppers.\u003c/p>\n\u003ch3>Ingredients\u003c/h3>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1¼\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>warm water\u003c/td>\u003ctd>~80°F; up to 2 Tbsp more if fresh-milled dough is stiff\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Tbsp\u003c/td>\u003ctd>olive oil\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>freshly milled whole wheat flour\u003c/td>\u003ctd>soft white wheat preferred; see notes below\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>salt\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2¼\u003c/td>\u003ctd>tsp\u003c/td>\u003ctd>active dry yeast\u003c/td>\u003ctd>one 0.25-oz packet\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>cornmeal\u003c/td>\u003ctd>for dusting pan\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Toppings (typical family pizza)\u003c/h4>\n\u003ctable class=\"recipe-table\">\u003cthead>\n\u003ctr>\u003cth>Amount\u003c/th>\u003cth>Unit\u003c/th>\u003cth>Ingredient\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>powdered tomato sauce\u003c/td>\u003ctd>reconstituted per pantry method\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2–3\u003c/td>\u003ctd>cups\u003c/td>\u003ctd>shredded mozzarella\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>pepperoni\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>artichoke hearts\u003c/td>\u003ctd>canned, drained\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>bell peppers\u003c/td>\u003ctd>sliced\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Instructions\u003c/h3>\n\u003col>\n\u003cli>Add ingredients to bread pan in \u003cstrong>manufacturer&#x27;s recommended order\u003c/strong> (usually liquids first, then flour, salt, yeast last). Use \u003cstrong>1¼ cups warm water\u003c/strong> for 100% fresh-milled whole wheat (add up to 2 Tbsp more during knead if dough is stiff).\u003c/li>\n\u003cli>Select \u003cstrong>Dough\u003c/strong> or \u003cstrong>Pizza Dough\u003c/strong> cycle; start.\u003c/li>\n\u003cli>After 5–10 minutes of kneading, check consistency — soft tacky ball. Add flour 1 Tbsp at a time if wet; water ½ Tbsp if dry.\u003c/li>\n\u003cli>When cycle completes, remove dough. Rest 15 minutes on oiled surface.\u003c/li>\n\u003cli>Divide in 2 for round pizzas, or press one batch to a rimmed sheet pan.\u003c/li>\n\u003cli>\u003cstrong>Optional pre-bake:\u003c/strong> 400°F, 10–12 min until edges just golden; add toppings; bake 15–20 min more. \u003cstrong>Or\u003c/strong> top raw dough and bake 425°F, 15–25 min until cheese bubbles and crust is golden.\u003c/li>\n\u003c/ol>\n\u003ch3>Fresh-milled whole wheat (default)\u003c/h3>\n\u003cp>\u003cstrong>Do not buy bread flour or AP\u003c/strong> — mill at home only.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>3 cups\u003c/strong> freshly milled whole wheat (soft white wheat works best for pizza; hard red OK with extra water).\u003c/li>\n\u003cli>\u003cstrong>Water:\u003c/strong> start \u003cstrong>1¼ cups\u003c/strong> (~80°F) — fresh-milled flour varies; dough should be soft and tacky, not stiff.\u003c/li>\n\u003cli>After 5–10 minutes kneading, adjust: \u003cstrong>+1 Tbsp water\u003c/strong> if dry, \u003cstrong>+1 Tbsp flour\u003c/strong> if wet.\u003c/li>\n\u003cli>\u003cstrong>Rest:\u003c/strong> after the dough cycle, rest \u003cstrong>20–30 min\u003c/strong> (longer than white dough) before shaping — helps bran hydrate.\u003c/li>\n\u003cli>\u003cstrong>Pre-bake recommended\u003c/strong> for 100% whole wheat: 400°F, 10–12 min before toppings.\u003c/li>\n\u003c/ul>\n\u003ch3>Legacy variation (not used)\u003c/h3>\n\u003cp>~~Substitute 1 cup whole wheat + 2 cups bread flour~~ — family uses \u003cstrong>100% fresh-milled whole wheat\u003c/strong> only.\u003c/p>\n\u003ch3>Post-cook notes\u003c/h3>\n\u003cp>_Append dated notes after each time you make this recipe._\u003c/p>", "missing": false, "path": "food/recipes/bread-machine-pizza-dough.md"}], "gtd": [{"id": "gtd:yoto-audit-playlists", "gtdId": "yoto-audit-playlists", "title": "Audit current Yoto playlists and my cards — export or screenshot inventory", "context": "@Computer", "done": false, "loc": "", "dur": "30m", "mode": "Computer", "solo": false, "focus": false, "source": "gtd/next-actions/computer.md"}, {"id": "gtd:yoto-define-scheme", "gtdId": "yoto-define-scheme", "title": "Define organization scheme (by child? subject? age band?) and target playlist structure", "context": "@Computer", "done": false, "loc": "", "dur": "30m", "mode": "Planning", "solo": false, "focus": true, "source": "gtd/next-actions/computer.md"}, {"id": "gtd:yoto-reorganize-first-pass", "gtdId": "yoto-reorganize-first-pass", "title": "First-pass reorganize: move cards into new playlists per scheme", "context": "@Computer", "done": false, "loc": "", "dur": "1h", "mode": "Computer", "solo": false, "focus": true, "source": "gtd/next-actions/computer.md"}, {"id": "gtd:book-lib-research-apps", "gtdId": "book-lib-research-apps", "title": "Research book-scanning apps (LibraryThing, BookBuddy, Libib, etc.) — note export/API options for Cursor sync", "context": "@Computer", "done": false, "loc": "", "dur": "30m", "mode": "Computer", "solo": false, "focus": false, "source": "gtd/next-actions/computer.md"}, {"id": "gtd:book-lib-define-requirements", "gtdId": "book-lib-define-requirements", "title": "Draft requirements doc in repo: scan workflow, fields to track (location, rotation, TGATB lists, reviews source)", "context": "@Computer", "done": false, "loc": "", "dur": "1h", "mode": "Planning", "solo": false, " <script>
(function () {
  const DATA = JSON.parse(document.getElementById('runtime-data').textContent);
  const WEEK = DATA.week;
  const STORAGE_KEY = 'phone-runtime:' + WEEK;
  const state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    const done = {};
    (DATA.gtd || []).forEach(t => { if (t.done) done[t.id] = true; });
    return { checked: done, updatedAt: null };
  }
  function saveState() {
    state.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function isChecked(id) { return !!state.checked[id]; }
  function setChecked(id, val) {
    if (val) state.checked[id] = true; else delete state.checked[id];
    saveState();
  }

  function weekdayLabel(iso) {
    const d = new Date(iso + 'T12:00:00');
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  }
  function dayNum(iso) { return iso.slice(8, 10).replace(/^0/, ''); }
  function todayIso() {
    const n = new Date();
    const m = String(n.getMonth() + 1).padStart(2, '0');
    const d = String(n.getDate()).padStart(2, '0');
    return n.getFullYear() + '-' + m + '-' + d;
  }

  let selectedDay = DATA.dates.includes(todayIso()) ? todayIso() : (DATA.dates[0] || null);
  let recipeFocus = null;

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'recipes') renderRecipes();
      if (btn.dataset.tab === 'gtd') renderGtd();
      if (btn.dataset.tab === 'done') renderDone();
      if (btn.dataset.tab === 'week') renderWeek();
    });
  });

  function itemRow(it, opts) {
    opts = opts || {};
    const checked = isChecked(it.id);
    const notes = it.notes ? '<p class="item-notes">' + escapeHtml(it.notes) + '</p>' : '';
    let actions = '';
    if (it.recipeSlug && !opts.hideRecipe) {
      actions = '<div class="item-actions"><button type="button" data-open-recipe="' + escapeAttr(it.recipeSlug) + '">Recipe</button></div>';
    }
    return '<article class="item' + (checked ? ' checked' : '') + '" data-id="' + escapeAttr(it.id) + '">' +
      '<input type="checkbox"' + (checked ? ' checked' : '') + ' aria-label="Done">' +
      '<div><span class="badge ' + escapeAttr(it.type) + '">' + escapeHtml(it.type) + '</span>' +
      '<p class="item-title">' + escapeHtml(it.title) + '</p>' + notes + actions + '</div></article>';
  }

  function bindItemChecks(root) {
    root.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id;
      const cb = el.querySelector('input[type=checkbox]');
      cb.addEventListener('change', () => {
        setChecked(id, cb.checked);
        el.classList.toggle('checked', cb.checked);
        if (document.getElementById('panel-done').classList.contains('active')) renderDone();
      });
    });
    root.querySelectorAll('[data-open-recipe]').forEach(btn => {
      btn.addEventListener('click', () => {
        recipeFocus = btn.getAttribute('data-open-recipe');
        document.querySelector('.tabs button[data-tab=recipes]').click();
      });
    });
  }

  function renderWeek() {
    const panel = document.getElementById('panel-week');
    const today = todayIso();
    let strip = '<div class="day-strip">';
    DATA.dates.forEach(d => {
      const cls = ['day-chip'];
      if (d === today) cls.push('today');
      if (d === selectedDay) cls.push('selected');
      strip += '<button type="button" class="' + cls.join(' ') + '" data-day="' + d + '">' +
        '<span class="wd">' + weekdayLabel(d) + '</span><span class="dn">' + dayNum(d) + '</span></button>';
    });
    strip += '</div>';
    let meta = '<p class="meta">' + escapeHtml(DATA.environmentNotes || '') + '</p>';
    if (DATA.calendarConstraints && DATA.calendarConstraints.length) {
      meta += '<div class="meta"><strong>This week</strong><ul>' +
        DATA.calendarConstraints.map(c => '<li>' + escapeHtml(c) + '</li>').join('') + '</ul></div>';
    }
    const dayItems = (DATA.itemsByDate[selectedDay] || []);
    let body = '<h2 class="day-heading">' + weekdayLabel(selectedDay) + ' ' + selectedDay + '</h2>';
    if (!dayItems.length) body += '<p class="empty">Nothing planned this day.</p>';
    else body += dayItems.map(it => itemRow(it)).join('');
    panel.innerHTML = strip + meta + body;
    panel.querySelectorAll('.day-chip').forEach(chip => {
      chip.addEventListener('click', () => { selectedDay = chip.dataset.day; renderWeek(); });
    });
    bindItemChecks(panel);
  }

  function renderRecipes() {
    const panel = document.getElementById('panel-recipes');
    let html = '';
    if (recipeFocus) {
      html += '<a href="#" class="back-link" id="clearRecipe">← All recipes</a>';
    }
    const list = recipeFocus
      ? DATA.recipes.filter(r => r.slug === recipeFocus)
      : DATA.recipes;
    if (!list.length) html += '<p class="empty">No recipes for this week.</p>';
    list.forEach(r => {
      html += '<article class="recipe-card" id="recipe-' + escapeAttr(r.slug) + '">' +
        '<h2>' + escapeHtml(r.title) + '</h2>' +
        '<p class="meta"><code>' + escapeHtml(r.slug) + '</code></p>' +
        r.html + '</article>';
    });
    panel.innerHTML = html;
    const clear = document.getElementById('clearRecipe');
    if (clear) clear.addEventListener('click', (e) => { e.preventDefault(); recipeFocus = null; renderRecipes(); });
    if (recipeFocus) {
      const el = document.getElementById('recipe-' + recipeFocus);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function renderGtd() {
    const panel = document.getElementById('panel-gtd');
    const contexts = [...new Set(DATA.gtd.map(t => t.context))];
    const locs = [...new Set(DATA.gtd.map(t => t.loc).filter(Boolean))];
    let filters = '<div class="gtd-filters">' +
      '<select id="gtdContext"><option value="">All contexts</option>' +
      contexts.map(c => '<option value="' + escapeAttr(c) + '">' + escapeHtml(c) + '</option>').join('') +
      '</select>' +
      '<select id="gtdLoc"><option value="">Any location</option>' +
      locs.map(c => '<option value="' + escapeAttr(c) + '">' + escapeHtml(c) + '</option>').join('') +
      '</select>' +
      '<select id="gtdOpen"><option value="open">Open only</option><option value="all">All</option><option value="done">Done only</option></select>' +
      '</div>';
    panel.innerHTML = filters + '<div id="gtdList"></div>';
    const ctxEl = panel.querySelector('#gtdContext');
    const locEl = panel.querySelector('#gtdLoc');
    const openEl = panel.querySelector('#gtdOpen');
    function paint() {
      const ctx = ctxEl.value;
      const loc = locEl.value;
      const open = openEl.value;
      let tasks = DATA.gtd.filter(t => {
        if (ctx && t.context !== ctx) return false;
        if (loc && t.loc !== loc) return false;
        const checked = isChecked(t.id);
        if (open === 'open' && checked) return false;
        if (open === 'done' && !checked) return false;
        return true;
      });
      const byCtx = {};
      tasks.forEach(t => { (byCtx[t.context] = byCtx[t.context] || []).push(t); });
      let html = '';
      Object.keys(byCtx).sort().forEach(c => {
        html += '<h3 class="context-h">' + escapeHtml(c) + '</h3>';
        byCtx[c].forEach(t => {
          html += itemRow({ id: t.id, type: 'GTD', title: t.title, notes: [t.dur, t.mode, t.loc].filter(Boolean).join(' · '), recipeSlug: null }, { hideRecipe: true });
        });
      });
      if (!html) html = '<p class="empty">No matching actions.</p>';
      const list = panel.querySelector('#gtdList');
      list.innerHTML = html;
      bindItemChecks(list);
    }
    ctxEl.addEventListener('change', paint);
    locEl.addEventListener('change', paint);
    openEl.addEventListener('change', paint);
    paint();
  }

  function renderDone() {
    const panel = document.getElementById('panel-done');
    const weekItems = DATA.items.filter(it => isChecked(it.id));
    const gtdItems = DATA.gtd.filter(t => isChecked(t.id)).map(t => ({
      id: t.id, type: 'GTD', title: t.title, notes: t.context, recipeSlug: null, date: ''
    }));
    let html = '<h2 class="day-heading">Accomplished</h2>';
    html += '<p class="meta">Checked items stay here. Uncheck to undo.</p>';
    if (!weekItems.length && !gtdItems.length) {
      html += '<p class="empty">Nothing checked off yet this week.</p>';
    } else {
      if (weekItems.length) {
        html += '<h3 class="context-h">Week plan</h3>';
        weekItems.forEach(it => { html += itemRow(it); });
      }
      if (gtdItems.length) {
        html += '<h3 class="context-h">GTD</h3>';
        gtdItems.forEach(it => { html += itemRow(it, { hideRecipe: true }); });
      }
    }
    panel.innerHTML = html;
    bindItemChecks(panel);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }

  function completionsPayload() {
    const checkedIds = Object.keys(state.checked).filter(k => state.checked[k]);
    const planDone = DATA.items.filter(it => state.checked[it.id]).map(it => ({
      id: it.id, type: it.type, date: it.date, title: it.title, recipeSlug: it.recipeSlug || null
    }));
    const gtdDone = DATA.gtd.filter(t => state.checked[t.id]).map(t => ({
      id: t.id, gtdId: t.gtdId, title: t.title, context: t.context
    }));
    return {
      week: WEEK,
      exportedAt: new Date().toISOString(),
      source: 'phone-runtime',
      checkedIds,
      plan: planDone,
      gtd: gtdDone
    };
  }

  function showExport() {
    const text = JSON.stringify(completionsPayload(), null, 2);
    document.getElementById('exportText').value = text;
    document.getElementById('exportBox').classList.add('open');
  }
  document.getElementById('btnExport').addEventListener('click', showExport);
  document.getElementById('btnCopy').addEventListener('click', async () => {
    const text = JSON.stringify(completionsPayload(), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      alert('Copied completions JSON');
    } catch (e) {
      showExport();
    }
  });
  document.getElementById('btnCloseExport').addEventListener('click', () => {
    document.getElementById('exportBox').classList.remove('open');
  });
  document.getElementById('btnImport').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        (data.checkedIds || []).forEach(id => { state.checked[id] = true; });
        saveState();
        renderWeek();
        alert('Imported ' + (data.checkedIds || []).length + ' checks');
      } catch (e) {
        alert('Could not read JSON');
      }
    };
    reader.readAsText(file);
  });

  // Fix GTD badge class (not in CSS) — treat as Menu-like
  const style = document.createElement('style');
  style.textContent = '.badge.GTD { background:#e7e0f2; color:#3d2f5c; }';
  document.head.appendChild(style);

  renderWeek();
})();
</script>
</body>
</html>
